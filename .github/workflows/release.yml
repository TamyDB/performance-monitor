name: Build Windows and publish release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      video_url:
        description: 'URL HTTPS direta do MP4 (opcional se BAD_APPLE_VIDEO_URL estiver configurada)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Windows x64 executable
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Obtain video
        env:
          VIDEO_URL: ${{ inputs.video_url || vars.BAD_APPLE_VIDEO_URL }}
        run: |
          if (Test-Path -LiteralPath 'bad-apple.mp4' -PathType Leaf) { exit 0 }
          if ([string]::IsNullOrWhiteSpace($env:VIDEO_URL)) {
            throw 'MP4 ausente. Configure a variável BAD_APPLE_VIDEO_URL no repositório ou informe video_url ao executar a Action manualmente.'
          }
          $videoUri = [Uri]$env:VIDEO_URL
          if (!$videoUri.IsAbsoluteUri -or $videoUri.Scheme -ne 'https') {
            throw 'A URL do vídeo deve usar HTTPS e apontar diretamente para o MP4.'
          }
          Invoke-WebRequest -Uri $videoUri -OutFile 'bad-apple.mp4' -TimeoutSec 180
          if ((Get-Item -LiteralPath 'bad-apple.mp4').Length -eq 0) {
            throw 'O download do vídeo está vazio.'
          }

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao instalar dependências.' }

      - name: Verify Python and authenticated encryption
        run: |
          python -m compileall -q app.py build.py media.py
          if ($LASTEXITCODE -ne 0) { throw 'Falha de sintaxe Python.' }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Falha nos testes.' }

      - name: Build executable
        run: |
          python build.py
          if ($LASTEXITCODE -ne 0) { throw 'Falha no build.' }
          if (!(Test-Path -LiteralPath 'dist/PcDiagnostic.exe' -PathType Leaf)) {
            throw 'O executável não foi gerado.'
          }
          $hash = (Get-FileHash 'dist/PcDiagnostic.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  PcDiagnostic.exe" | Set-Content -LiteralPath 'dist/SHA256SUMS.txt' -Encoding ascii

      - name: Save build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PcDiagnostic-windows-x64
          path: |
            dist/PcDiagnostic.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $releaseTag = $env:GITHUB_REF_NAME
          } else {
            $releaseTag = "build-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          }
          # Do not overwrite an existing release or its executable on a rerun.
          gh release view $releaseTag *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "A release $releaseTag já existe. Os arquivos não foram substituídos; o build permanece nos artifacts desta execução."
          }
          gh release create $releaseTag 'dist/PcDiagnostic.exe' 'dist/SHA256SUMS.txt' --target $env:GITHUB_SHA --title "PC Diagnostic $releaseTag — Windows x64" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao publicar a release.' }
